services:
  - type: web
    name: dental-care-api
    runtime: node
    rootDir: Api
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MYSQL_URL
        sync: false
      - key: DB_SSL
        value: "true"
      - key: START_SERVER
        value: "true"
      - key: JWT_SECRET
        generateValue: true
